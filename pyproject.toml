[project]
name = "hip"
version = "0.3"
description = "HTTP, for everyone."
readme = "docs/README.md"
requires-python = ">=3.10"
authors = [
    { name = "the hip community" },
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "truststore",
]

[dependency-groups]
dev = [
    "mkdocs==2.0.dev6",
    "mypy==2.3.1",
    "pytest==8.3.5",
    "pytest-cov==7.1.0",
    "ruff",
    "typing-extensions>=4.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
